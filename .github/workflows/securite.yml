# Contrôles de sécurité (gratuits sur un dépôt public) :
# - CodeQL : analyse du code Kotlin (appli, moteur) et du JavaScript des pages web ;
# - OSV-Scanner : dépendances JavaScript (outils de compilation du moteur web) ayant une faille connue.
# Les dépendances Gradle sont suivies par Dependabot (.github/dependabot.yml).
# Les résultats apparaissent dans l'onglet Security du dépôt.
name: Sécurité

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # chaque lundi : nouvelles failles publiées depuis

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-24.04 # fixé : un changement d'image ne doit pas casser la CI sans prévenir
    timeout-minutes: 40
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        if: matrix.language == 'java-kotlin'

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Pour le JavaScript : les sources des pages (web/src), pas le moteur compilé.
          config: |
            paths-ignore:
              - web/dist
              - android/**/build

      - name: Compilation analysée (Kotlin)
        if: matrix.language == 'java-kotlin'
        working-directory: android
        run: ./gradlew --no-build-cache :engine:compileKotlinJvm :app:compileDebugKotlin

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  dependances-js:
    permissions:
      security-events: write
      contents: read
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.0
    with:
      scan-args: |-
        --lockfile=android/kotlin-js-store/yarn.lock
