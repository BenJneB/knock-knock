# Tests à chaque pull request, puis pages web et APK téléchargeables (onglet Actions, artefacts).
# Lançable aussi à la main (Actions > Tests > Run workflow), par exemple pour construire l'APK depuis master.
# Gratuit : illimité sur un dépôt public, dans les 2 000 minutes mensuelles offertes sur un dépôt privé.
name: Tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-24.04 # fixé : un changement d'image ne doit pas casser la CI sans prévenir
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Version alignée sur celle utilisée par Gradle pour le moteur JavaScript (android/build.gradle.kts).
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.2

      - uses: gradle/actions/setup-gradle@v6

      - name: Tests du moteur (stratégie, lecture des captures ; JVM et JavaScript)
        run: ./gradlew :engine:allTests

      - name: Pages web (moteur JavaScript)
        run: |
          ./gradlew :engine:webPage
          node ../tools/check-web-engine.mjs

      # Pages web assemblées (un fichier par mode).
      - uses: actions/upload-artifact@v7
        with:
          name: pages-web
          path: web/dist/

      # Clé de signature (secrets du dépôt, voir tools/creer-cle.sh). Absente (pull request d'un fork,
      # secrets pas encore créés) : l'APK est signé avec une clé de debug.
      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.CONSEIL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/conseil.jks"
            echo "CONSEIL_KEYSTORE=$RUNNER_TEMP/conseil.jks" >> "$GITHUB_ENV"
          else
            echo "::notice::Secrets de signature absents : APK signé avec une clé de debug (voir tools/creer-cle.sh)."
          fi

      - name: Style du code (ktlint) et Android Lint
        run: ./gradlew ktlintCheck :app:lintDebug

      - name: Appli Android
        env:
          CONSEIL_KEYSTORE_PASSWORD: ${{ secrets.CONSEIL_KEYSTORE_PASSWORD }}
          CONSEIL_KEY_ALIAS: ${{ secrets.CONSEIL_KEY_ALIAS }}
          CONSEIL_KEY_PASSWORD: ${{ secrets.CONSEIL_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Sécurité de l'APK (aucune autorisation réseau ni inattendue)
        run: ../tools/verifier-autorisations.sh

      # APK à installer : arm64-v8a pour presque tous les téléphones, armeabi-v7a pour les plus anciens.
      - uses: actions/upload-artifact@v7
        with:
          name: apk-android
          path: |
            android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
            android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: rapports-de-tests
          path: |
            android/engine/build/reports/tests/
            android/app/build/reports/lint-results-debug.html
